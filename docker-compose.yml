# CPU by default. For an NVIDIA GPU:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
name: qaror-234-rag

services:
  ollama:
    image: ollama/ollama:0.34.0
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "2"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: pulls the configured models, then exits. The API starts only after it succeeds.
  models:
    image: ollama/ollama:0.34.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$LLM_MODEL\" && ollama pull \"$$EMBED_MODEL\""]
    restart: "no"

  api:
    build: .
    image: qaror-234-rag-api:latest
    depends_on:
      models:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AUTO_INGEST: "true"
      # The same values the puller used, so the API never asks for a model that was not pulled.
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    ports:
      - "8000:8000"
    volumes:
      - index-data:/app/data/index
    restart: unless-stopped

volumes:
  ollama-models:
    name: qaror234-ollama
  index-data:
